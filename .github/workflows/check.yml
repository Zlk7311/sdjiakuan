name: VPN Gate Node Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download upstream hosts
        run: |
          mkdir -p public
          curl -fsSL --retry 3 https://jerylihub.github.io/gate/hosts.txt -o public/hosts.txt
          test "$(grep -c 'sstp://' public/hosts.txt)" -gt 0
          echo '<meta charset="utf-8"><a href="hosts.txt">hosts.txt</a>' > public/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: ${{ steps.deployment.outputs.page_url }}"'
